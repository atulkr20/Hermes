version: '3.9'

services:
  backend:
    image: atulkr20/hermes:latest
    container_name: hermes_backend
    restart: unless-stopped
    ports:
      - '3001:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env 

  postgres:
    image: postgres:15-alpine
    container_name: hermes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hermes_db
    ports:
      - '5433:5432'
    volumes:
      - hermes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hermes_redis
    restart: unless-stopped
    ports:
      - '6380:6379' 
    volumes:
      - hermes_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hermes_postgres_data:
  hermes_redis_data: